services:
  - type: web
    name: sonora-social
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MUSIC_DB_PATH
        value: /app/data/sonora.sqlite
    disk:
      name: sonora-data
      mountPath: /app/data
      sizeGB: 1
